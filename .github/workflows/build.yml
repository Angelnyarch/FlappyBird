cat > .github/workflows/build.yml << 'EOF'
name: Build FlappyBird

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libudev-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev \
            libfreetype-dev

      - name: Configurar y compilar
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --config Release -j4

      - name: Empaquetar
        run: |
          mkdir FlappyBird-Linux
          cp build/FlappyBird FlappyBird-Linux/
          cp -r resources FlappyBird-Linux/
          zip -r FlappyBird-Linux.zip FlappyBird-Linux

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-Linux
          path: FlappyBird-Linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar y compilar
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --config Release -j4

      - name: Empaquetar
        run: |
          mkdir FlappyBird-Windows
          copy build\Release\FlappyBird.exe FlappyBird-Windows\
          xcopy resources FlappyBird-Windows\resources\ /E /I
          Compress-Archive -Path FlappyBird-Windows -DestinationPath FlappyBird-Windows.zip

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-Windows
          path: FlappyBird-Windows.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FlappyBird-Linux/FlappyBird-Linux.zip
            FlappyBird-Windows/FlappyBird-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
EOF